name: Windows Build

on:
  push:
    branches: [main, master, release/**]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          # setuptools/backports.tarfile: PyInstaller's pkg_resources hook imports
          # jaraco.text → jaraco.context → backports on Python < 3.13 (frozen
          # builds crash at startup without them)
          pip install setuptools backports.tarfile
          pip install pyinstaller==6.11.1

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build executable
        run: pyinstaller CRM_Local.spec --noconfirm

      - name: Verify executable
        run: |
          if (Test-Path "dist\CRM_Local.exe") {
            Write-Host "Executable found"
            $size = (Get-Item "dist\CRM_Local.exe").Length
            Write-Host "Size: $size bytes"
          } else {
            Write-Error "Executable NOT found"
            exit 1
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CRM_Local-exe
          path: dist/CRM_Local.exe

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" CRM_Local.iss
        continue-on-error: true

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CRM_Local-installer
          path: dist/CRM_Local-Setup.exe
        continue-on-error: true

      - name: Build final checksums
        shell: pwsh
        run: |
          $lines = @()
          foreach ($f in @("dist\CRM_Local.exe", "dist\CRM_Local-Setup.exe")) {
            if (Test-Path $f) {
              $h = (Get-FileHash $f -Algorithm SHA256).Hash
              $size = (Get-Item $f).Length
              $lines += "$h  $(Split-Path $f -Leaf)  ($size bytes)"
              Write-Host "$h  $f  ($size bytes)"
            } else {
              Write-Host "missing (skipped): $f"
            }
          }
          $lines | Out-File -Encoding utf8 dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: CRM_Local-SHA256SUMS
          path: dist/SHA256SUMS.txt